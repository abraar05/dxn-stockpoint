name: Verify live API (InfinityFree)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api-verify.yml'

jobs:
  verify:
    name: Migrate + verify production DB
    runs-on: ubuntu-latest
    steps:
      - name: Migrate and verify
        env:
          API_ORIGIN: https://dxn.infy.click
        run: |
          base="$API_ORIGIN/api/v1"
          echo "=== health (before) ==="
          health="$(curl -sS --max-time 30 "$base/health" 2>&1 || true)"
          echo "$health"
          if [ -z "$health" ]; then
            echo "::error::InfinityFree did not answer the runner either. The site may be down or the API not uploaded."
            exit 1
          fi

          installed="$(echo "$health" | grep -o '"installed":[a-z]*' | cut -d: -f2 || true)"
          echo "installed=$installed"

          if [ "$installed" != "true" ]; then
            echo "::error::API is not installed. Open $API_ORIGIN/api/install.php?key=<install_key> in a browser once."
            exit 1
          fi

          echo "=== migrate ==="
          migrate="$(curl -sS --max-time 60 -X POST "$base/migrate" 2>&1 || true)"
          echo "$migrate"

          echo "=== health (after) ==="
          curl -sS --max-time 30 "$base/health"; echo

          echo "=== config ==="
          config="$(curl -sS --max-time 30 "$base/config" 2>&1 || true)"
          echo "$config"
          echo "$config" | grep -q '"branch_name":"Mohammadpur Stock Point"' \
            && echo "✔ branch_name is Mohammadpur Stock Point" \
            || echo "::warning::branch_name is not the Mohammadpur profile (a custom value is preserved)"

          echo "=== products (image_url check) ==="
          products="$(curl -sS --max-time 30 "$base/products" 2>&1 || true)"
          echo "$products" | grep -o 'abraar05.github.io/dxn-stockpoint/images/products/[^"]*' | sort -u | head
          count="$(echo "$products" | grep -o 'abraar05.github.io/dxn-stockpoint/images/products/' | wc -l)"
          echo "product image_url references: $count"
          if [ "$count" -lt 12 ]; then
            echo "::warning::fewer than 12 products carry the new photo URL — run migrate again or check Schema::products()."
          fi

          echo "=== done ==="
