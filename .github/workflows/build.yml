name: Build & Release Production App

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Production Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/DXNStockpoint/gradlew

      - name: Build Release APK and App Bundle (AAB)
        working-directory: android/DXNStockpoint
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Package Release Assets
        run: |
          mkdir -p release-assets
          find android/DXNStockpoint/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-assets/dxn-stockpoint-v2.0.0.apk \;
          find android/DXNStockpoint/app/build/outputs/bundle/release/ -name "*.aab" -exec cp {} release-assets/dxn-stockpoint-v2.0.0.aab \;
          cp release-assets/dxn-stockpoint-v2.0.0.apk release-assets/dxn-stockpoint-latest.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DXN-Stockpoint-v2.0.0-Release-Assets
          path: release-assets/*
          retention-days: 30

      - name: Publish Production Release (v2.0.0)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "DXN Stockpoint v2.0.0 — Production Launch"
          body: |
            # 🚀 DXN Stockpoint Production Release (v2.0.0)

            Complete, production-ready POS, inventory management, and ordering suite for DXN stockpoints and distributors worldwide.

            ---

            ### 📦 Distribution Packages:
            * 📱 **Universal Release APK (Install Directly):**
              👉 **[dxn-stockpoint-v2.0.0.apk](https://github.com/abraar05/dxn-stockpoint/releases/download/v2.0.0/dxn-stockpoint-v2.0.0.apk)** *(or [latest alias](https://github.com/abraar05/dxn-stockpoint/releases/download/v2.0.0/dxn-stockpoint-latest.apk))*
            * 🛍️ **Google Play App Bundle (Play Store Submission):**
              👉 **[dxn-stockpoint-v2.0.0.aab](https://github.com/abraar05/dxn-stockpoint/releases/download/v2.0.0/dxn-stockpoint-v2.0.0.aab)**

            ---

            ### 🌟 Key Production Capabilities:
            1. **Dual Native & Web Deployment**:
               - Native Android 8.0+ app built with Kotlin 2.0 & Jetpack Compose.
               - Progressive Web App (PWA) live on [GitHub Pages](https://abraar05.github.io/dxn-stockpoint/).
            2. **Official DXN Dual-Pricing**:
               - Real-time switching between official DXN Partner Member and Retail rates with profit margin transparency.
            3. **Multi-Currency Global Support**:
               - Supports BDT (৳), USD ($), MYR (RM), EUR (€), and AED (د.إ).
            4. **Automated Thermal Invoicing**:
               - POS thermal receipts with date, customer ID, itemized breakdowns, and 1-click print support.
            5. **Direct Zero-Cost WhatsApp Integration**:
               - Deep-link order generation directly to WhatsApp (`+8801987851131`) with no paid API keys required.
            6. **Offline-First Resilience**:
               - Local catalog caching and SQLite/LocalStorage synchronization.
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
